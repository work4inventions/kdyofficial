<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KDY Coming Soon Necklaces</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@400;500&display=swap">

  <style>
    :root {
      --bg: #F3F0F8;
      --ink: #1B1A1F;
      --ink-soft: #34313C;
      --ink-muted: #3E3B46;
      --accent: #7A5C18;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
    }

    a { color: var(--ink); }
    a:hover { color: var(--accent); }

    /* Full page wrapper: fixed height hata di, ab screen ke hisaab se adjust hoga */
    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      justify-content: center;
      align-items: center;
  }


    .logo {
      display: inline-block;
      align-self: flex-start;
      line-height: 0;
    }

    .logo__img {
    display: block;
    height: clamp(85px, 16vw, 160px);
    width: auto;
    max-width: 100%;
}

    .hero {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 40px;
      max-width: 620px;
      padding: 48px 0;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 25px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
  }

    .title {
      margin: 0;
      font-family: 'Bodoni Moda', serif;
      font-weight: 400;
      font-size: clamp(56px, 9vw, 128px);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    .title em {
      font-style: italic;
      color: var(--accent);
    }

  
    .footer {
      font-size: 13px;
      letter-spacing: 0.06em;
      padding: 10px;
      color: var(--ink-muted);
    }

    /* Mobile */
    @media (max-width: 700px) {
      
      .eyebrow { font-size: 12px; letter-spacing: 0.22em; }
    }
  </style>
</head>

<body>
  <div class="page">
    <main class="hero">
      <a class="logo" href="/" aria-label="KDY home">
        <img class="logo__img" src="./assets/logo-black.svg" alt="KDY">
      </a>
      <div class="eyebrow">
        Launching soon
      </div>
      
    </main>

    <footer class="footer">© 2026 KDY</footer>

  </div>
</body>
</html>
