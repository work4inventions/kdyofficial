<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KDY Coming Soon Necklaces</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@400;500&display=swap">

  <style>
    :root {
      --bg: #F3F0F8;
      --ink: #1B1A1F;
      --ink-soft: #34313C;
      --ink-muted: #3E3B46;
      --accent: #7A5C18;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
    }

    a { color: var(--ink); }
    a:hover { color: var(--accent); }

    /* Full page wrapper: fixed height hata di, ab screen ke hisaab se adjust hoga */
    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh; /* mobile browser bar ke liye */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* Background image: hamesha poori screen cover karegi */
    .page__image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 75% 55%;
    }

    .page__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(243, 240, 248, 0.96) 0%,
        rgba(243, 240, 248, 0.86) 38%,
        rgba(243, 240, 248, 0) 72%);
    }

    .content {
      position: relative;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      padding: 36px clamp(20px, 6vw, 96px) 32px;
    }

    /* Logo: ab alag class hai, background image ki class nahi */
    .logo {
      display: inline-block;
      align-self: flex-start;
      line-height: 0;
    }

    .logo__img {
      display: block;
      height: clamp(28px, 4vw, 44px);
      width: auto;
      max-width: 100%;
    }

    .hero {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
      max-width: 620px;
      padding: 48px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .eyebrow__line {
    width: 40px;
    height: 2px;
    background: var(--accent);
}
    .title {
    margin: 0;
    font-family: 'Bodoni Moda', serif;
    font-weight: 600;
    font-size: clamp(56px, 9vw, 128px);
    line-height: 0.85;
    letter-spacing: 0.2rem;
}

    .title em {
      font-style: italic;
      color: var(--accent);
    }

    .lead {
      margin: 0;
      max-width: 440px;
      font-size: 18px;
      line-height: 1.6;
      color: var(--ink-soft);
      font-family: 'Jost', sans-serif;
    }

    .button {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      min-height: 48px;
      padding: 0 28px;
      background: var(--ink);
      color: var(--bg);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: background 0.2s ease;
    }

    .button:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .footer {
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    /* Tablet / chhoti screen */
    @media (max-width: 900px) {
      .page__image { object-position: 70% 50%; }
      .page__overlay {
        background: linear-gradient(90deg,
          rgba(243, 240, 248, 0.96) 0%,
          rgba(243, 240, 248, 0.88) 50%,
          rgba(243, 240, 248, 0.2) 100%);
      }
    }

    /* Mobile */
    @media (max-width: 700px) {
      .page__image { object-position: 65% center; }
      .page__overlay {
        background: linear-gradient(180deg,
          rgba(243, 240, 248, 0.94) 0%,
          rgba(243, 240, 248, 0.82) 60%,
          rgba(243, 240, 248, 0.4) 100%);
      }
      .content { padding-top: 24px; }
      .eyebrow { font-size: 12px; letter-spacing: 0.22em; }
      .eyebrow__line { width: 32px; }
      .hero { padding: 32px 0; }
    }
  </style>
</head>

<body>
  <div class="page">

    <img class="page__image"
         src="./assets/f4d2fdb11d289ffdbf58115f80aaece8.png"
         alt="KDY padlock necklaces in silver and gold, each engraved with the KDY mark">
    <div class="page__overlay" aria-hidden="true"></div>

    <div class="content">

      <a class="logo" href="/" aria-label="KDY home">
        <img class="logo__img" src="./assets/logo-black.svg" alt="KDY">
      </a>

      <main class="hero">
        <div class="eyebrow">
          <span class="eyebrow__line" aria-hidden="true"></span>
          Launching soon
        </div>

        <h1 class="title">Coming<br><em>soon.</em></h1>

        <p class="lead">Padlock necklaces engraved with the KDY mark, in polished silver and warm gold.</p>

        <!--<a class="button" href="https://kdyofficial.myshopify.com">Visit kdyofficial</a>-->
      </main>

      <footer class="footer">© 2026 KDY</footer>

    </div>
  </div>
</body>
</html>
