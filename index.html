<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KDY Coming Soon Necklaces</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@400;500&display=swap">

  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: #fff;
      color: #fff;
      font-family: 'Jost', sans-serif;
    }

    a { color: #fff; }
    a:hover { color: #fff; }

    /* Full page wrapper: fixed height hata di, ab screen ke hisaab se adjust hoga */
    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      justify-content: center;
      align-items: center;
    }
    .page:before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 1;
      background: #000;
      display: block;
      opacity: 0.4;
    }
    .page > img {
      position: absolute;
      right: 0;
      top: 0;
      z-index: 0;
      height: 100dvh;
      width: 100%;
      object-fit: cover;
    }
    .logo__img {
      display: block;
      height: clamp(85px, 16vw, 160px);
      width: auto;
      max-width: 100%;
    }

    .hero {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 40px;
      align-items: center;
      max-width: 620px;
      position: relative;
      z-index: 2;
      padding: 48px 0;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 25px;
      font-size: clamp(17px, 5vw, 32px);
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-shadow: 0 0 11px #000;
      color:  #fff;
  }
    .footer {
      font-size: 13px;
      letter-spacing: 0.06em;
      padding: 10px;
      position: relative;
      z-index: 2;
      color: #fff;
    }

  
  </style>
</head>

<body>
  <div class="page">
    <img src="assets/f4d2fdb11d289ffdbf58115f80aaece8.png" alt="" width="" height=""/>
    <main class="hero">
      <a class="logo" href="/" aria-label="KDY home">
        <img class="logo__img" src="./assets/logo-black.svg" alt="KDY">
      </a>
      <div class="eyebrow">
        Launching soon
      </div>
      
    </main>

    <footer class="footer">© 2026 KDYOFFICIAL</footer>

  </div>
</body>
</html>
